version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hostra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hostra-net
    deploy:
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    networks:
      - hostra-net
volumes:
  postgres_data:
  redis_data:

networks:
  hostra-net:
    external: true